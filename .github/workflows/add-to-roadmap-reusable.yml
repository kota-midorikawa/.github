name: Add item to KM Engineering Roadmap
on:
  workflow_call:
    inputs:
      project_url:
        required: true
        type: string
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ inputs.project_url }}
          github-token: ${{ secrets.PROJECTS_TOKEN }}
